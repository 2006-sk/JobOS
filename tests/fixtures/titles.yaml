# Real-world title cases with expected (level, field) labels, used to pin
# relevance.py's behavior against the aggregator corpus it was tuned on.
#
# Every case below was run through the real classifier (classify_level /
# classify_field) before being committed here -- nothing in this file is a
# guess. See tests/test_relevance.py for the parametrized assertions.
#
# A GAP THIS FIXTURE CAUGHT, SINCE FIXED:
# "Principal Packaging Integration Engineer New Grad" originally classified as
# field=none -- FIELD_KEYWORDS[stretch] had no "packaging" entry -- so a genuine
# new-grad hardware role was rejected outright instead of being routed to the
# digest. The same pass found "Entry Level .Net Developer" (51 such titles in
# the corpus) falling out because only compound forms like "software developer"
# were matched. Both are now covered; the cases below pin the fixed behavior.

cases:
  # --- tricky positives: must classify as early-career despite a seniority word
  - title: "[2026] Senior Machine Learning Engineer, X - PhD Early Career"
    level: new-grad
    field: adjacent
  - title: "Software Development Engineer - Early Career"
    level: new-grad
    field: core
  - title: "Member of Technical Staff New Grad - Machine Learning Capabilities"
    level: new-grad
    field: adjacent
  - title: "Senior Silicon Photonics Integration Engineer New Grad"
    level: new-grad
    field: stretch
  - title: "Principal Packaging Integration Engineer New Grad"
    level: new-grad
    field: stretch  # regression: "packaging" was missing from the stretch tier
  - title: "Staff Scientist/Engineering Intern - Summer 2026"
    level: internship
    field: none  # bare "engineering" has no FIELD_CORE keyword match
  - title: "ERP Intern: Rising Senior Technology"
    level: internship
    field: none

  # --- deliberate negatives: must NOT be early-career
  - title: "Engineering Manager"
    level: neither
    field: none
  - title: "Senior Staff SWE"
    level: neither
    field: core
  - title: "Sales Engineer"
    level: neither
    field: none  # also non-engineering, see is_non_engineering()
  - title: "Senior Product Manager - International Fulfillment"
    level: neither
    field: none  # regression: `intern` must not match inside "International"
  - title: "Director of Platform Engineering"
    level: neither
    field: core
  - title: "Engineering Manager, University Recruiting"
    level: neither
    field: none  # early-career marker must NOT rescue a manager title

  # --- ordinary positives
  - title: "Software Engineer Intern - Summer 2026"
    level: internship
    field: core
  - title: "New Grad Software Engineer, Backend"
    level: new-grad
    field: core
  - title: "2027 Summer Intern - Machine Learning"
    level: internship
    field: adjacent
  - title: "Hardware Engineering Intern"
    level: internship
    field: stretch
  - title: "Quantitative Developer - New Grad"
    level: new-grad
    field: adjacent
